[package]
name = "agent-office-menubar"
version = "0.4.2"
description = "Agent Office nella menu bar di macOS"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde_json = "1"
tauri-plugin-notification = "2"

[profile.release]
strip = true
lto = true

# aspetto effettivo della barra dei menu (su macOS 26 è trasparente e segue lo sfondo, non il tema di sistema)
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSResponder", "NSAppearance"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSString"] }
