name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
      # smoke visivo (#23): dist/web è già stato generato da `npm run check`
      - run: npx playwright install chromium
      - run: npm run test:visual
        env: { AGENT_OFFICE_VISUAL: '1' }
