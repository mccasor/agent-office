name: Linux bundle
# Pacchetti Linux dell'app (#107): AppImage e deb, costruiti su Ubuntu 22.04 (glibc 2.35: girano anche sulle
# distribuzioni più recenti) e lasciati come artifact del workflow. Si lancia a mano (Actions → Run workflow) o con un
# tag v*. Il bundle macOS resta a scripts/release.mjs; i target Linux stanno in src-tauri/tauri.linux.conf.json.
#
# Pubblicazione: con il segreto TAP_TOKEN (token con Contents: read and write sul tap pubblico
# mccasor/homebrew-agent-office) AppImage e deb si allegano alla release v<versione> del tap, che scripts/release.mjs
# --publish deve aver già creato: si lancia a mano dopo la release macOS. Senza il segreto restano solo come artifact.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bundle:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # dipendenze di build di Tauri su Linux; patchelf serve a linuxdeploy per l'AppImage
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      # beforeBuildCommand (tauri.conf.json) compila server e pagina e prepara le risorse dell'app
      - run: npx tauri build --bundles appimage,deb
      - id: version
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: agent-office-${{ steps.version.outputs.version }}-linux-amd64
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
      - name: Allega i pacchetti alla release del tap
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        if: env.GH_TOKEN != ''
        run: >-
          gh release upload "v${{ steps.version.outputs.version }}"
          src-tauri/target/release/bundle/appimage/*.AppImage src-tauri/target/release/bundle/deb/*.deb
          --repo mccasor/homebrew-agent-office --clobber
